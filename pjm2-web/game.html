<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>PJM2-Web — Stage 1 (playable demo)</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🗼</text></svg>" />
    <!-- Start the critical-path data fetches at t=0, while the (dev) ES-module
         waterfall is still resolving; see docs/LOAD_HAR_ANALYSIS.md. -->
    <link rel="preload" as="fetch" crossorigin href="/assets/packs/manifest.json" />
    <link rel="preload" as="fetch" crossorigin href="/assets/stages/3d_stage_001/scene-webp.json.gz" />
    <link rel="preload" as="fetch" crossorigin href="/assets/stages/3d_stage_001/meshes.pack.sh.bin.gz" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #app { width: 100%; height: 100%; }
      canvas { display: block; }
      .panel {
        position: fixed; color: #eee; font: 13px/1.5 monospace;
        background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 8px; pointer-events: none;
      }
      #hud { top: 10px; left: 10px; font-size: 15px; }
      #hud b { color: #ffd34d; }
      #wave { top: 10px; right: 10px; text-align: right; }
      #perf { bottom: 10px; right: 10px; color: #9f9; font-size: 11px; }
      #msg {
        bottom: 12%; left: 50%; transform: translateX(-50%); color: #ffd34d;
        font-size: 15px; text-align: center; transition: opacity .3s; opacity: 0;
      }
      #help { bottom: 10px; left: 10px; color: #ccc; font-size: 12px; }
      #banner {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        flex-direction: column; gap: 10px; background: rgba(0,0,0,.55); color: #fff;
        font: 700 42px/1.3 monospace; z-index: 20; pointer-events: none; text-shadow: 0 2px 12px #000;
      }
      #banner small { font: 400 16px/1.4 monospace; color: #cde; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px;
        align-items: center; justify-content: center; background: #0a0e12; color: #cde;
        font: 14px/1.5 monospace; z-index: 30;
      }
      #loading-track { width: min(520px, 80vw); height: 10px; background: #1d2833; border-radius: 5px; overflow: hidden; }
      #loading-bar { width: 0%; height: 100%; background: #5db85d; transition: width .15s ease-out; }
      #start { display: none; margin-top: 10px; padding: 10px 26px; font: 700 16px monospace;
        background: #5db85d; color: #04120a; border: 0; border-radius: 8px; cursor: pointer; }
      #start:hover { background: #6fd86f; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="panel">…</div>
    <div id="wave" class="panel">…</div>
    <div id="msg" class="panel"></div>
    <div id="help" class="panel">
      WASD / arrows: walk &nbsp;·&nbsp; E / click a tree: open the build ring (WASD aim, E build, Q back)
      &nbsp;·&nbsp; camera: edge-pan / wheel-zoom &nbsp;·&nbsp; walk over coins to collect
    </div>
    <div id="perf" class="panel">…</div>
    <div id="banner"><span id="banner-title"></span><small id="banner-sub"></small></div>
    <div id="loading">
      <div>PJM2-Web — tl_stage_001 (3d_stage_001)</div>
      <div id="loading-track"><div id="loading-bar"></div></div>
      <div id="loading-text">bundle…</div>
      <button id="start">START</button>
    </div>
    <script type="module" src="/src/main/game.ts"></script>
  </body>
</html>
