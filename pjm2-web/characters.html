<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>PJM2-Web — Character Lab</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #app { width: 100%; height: 100%; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 8px; left: 8px; color: #9f9; font: 12px/1.4 monospace;
        background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; pointer-events: none;
      }
      #help {
        position: fixed; bottom: 8px; left: 8px; color: #ccc; font: 12px/1.5 monospace;
        background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 6px; pointer-events: none;
      }
      #panel {
        position: fixed; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px;
        color: #cde; font: 12px/1.4 monospace; background: rgba(0,0,0,.55);
        padding: 8px 10px; border-radius: 6px; max-height: 90vh; overflow-y: auto;
      }
      #panel .row { display: flex; gap: 8px; align-items: center; }
      #panel .name { min-width: 110px; color: #9f9; }
      #panel select { max-width: 220px; background: #14202b; color: #cde; border: 1px solid #335; font: 11px monospace; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px;
        align-items: center; justify-content: center; background: #0a0e12; color: #cde;
        font: 14px/1.5 monospace; z-index: 10;
      }
      #loading-track { width: min(520px, 80vw); height: 10px; background: #1d2833; border-radius: 5px; overflow: hidden; }
      #loading-bar { width: 0%; height: 100%; background: #5db85d; transition: width .15s ease-out; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">pjm2 character-lab…</div>
    <div id="panel"></div>
    <div id="help">drag: orbit &nbsp;·&nbsp; wheel: zoom &nbsp;·&nbsp; right-drag: pan &nbsp;·&nbsp; dropdowns: play any baked clip</div>
    <div id="loading">
      <div>Loading characters…</div>
      <div id="loading-track"><div id="loading-bar"></div></div>
      <div id="loading-text">manifest</div>
    </div>
    <script type="module" src="/src/main/character-lab.ts"></script>
  </body>
</html>
